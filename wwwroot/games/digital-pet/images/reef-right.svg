<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="staghornPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="anemoneRed" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="yellowSunCoral" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="rightRock" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="kelpRight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="clamShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glowRight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Giant Limestone Reef Shelf (Batu Karang Kanan) -->
  <path d="M480 380 L 80 380 Q 140 330, 220 310 Q 300 290, 390 260 Q 450 250, 480 270 Z" fill="url(#rightRock)" filter="url(#glowRight)"/>
  <path d="M480 380 L 150 380 Q 240 340, 320 330 Q 400 320, 480 340 Z" fill="#0f172a" opacity="0.65"/>

  <!-- Background Swaying Kelp Seaweed -->
  <g class="seaweed-sway-back" opacity="0.85">
    <path d="M370 340 C 400 240, 340 150, 380 50 C 390 120, 420 220, 390 340 Z" fill="url(#kelpRight)"/>
    <path d="M320 350 C 280 260, 340 170, 305 40 C 320 110, 275 210, 335 350 Z" fill="#10b981"/>
    <path d="M260 360 C 230 280, 280 200, 250 120 C 265 190, 220 270, 275 360 Z" fill="url(#kelpRight)"/>
  </g>

  <!-- Branching Staghorn Corals (Karang Tanduk Rusa Ungu-Biru) -->
  <g filter="url(#glowRight)" stroke="url(#staghornPurple)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Branch 1 -->
    <path d="M290 330 Q 300 250, 310 180 Q 315 150, 320 120" stroke-width="16" fill="none"/>
    <path d="M305 240 Q 330 220, 350 200" stroke-width="12" fill="none"/>
    <path d="M335 210 Q 355 190, 370 175" stroke-width="9" fill="none"/>
    <path d="M308 190 Q 290 160, 280 140" stroke-width="10" fill="none"/>
    <path d="M312 160 Q 330 140, 340 125" stroke-width="8" fill="none"/>

    <!-- Branch 2 (Belakang Lebih Gelap) -->
    <path d="M330 320 Q 350 260, 365 200 Q 380 160, 390 130" stroke-width="14" fill="none" opacity="0.85"/>
    <path d="M355 245 Q 380 230, 400 215" stroke-width="10" fill="none" opacity="0.85"/>
    <path d="M360 210 Q 345 185, 340 165" stroke-width="8" fill="none" opacity="0.85"/>
  </g>

  <!-- Glowing Yellow/Amber Sun Corals (Karang Matahari Emas) -->
  <g filter="url(#glowRight)">
    <!-- Polip Karang Matahari 1 -->
    <path d="M190 350 Q 185 300, 215 285 Q 245 270, 255 315 Q 260 350, 230 360 Z" fill="url(#yellowSunCoral)"/>
    <circle cx="215" cy="295" r="7" fill="#fef08a"/>
    <circle cx="235" cy="305" r="6" fill="#fef08a"/>
    <circle cx="205" cy="315" r="5" fill="#fde047"/>
    <circle cx="240" cy="325" r="5.5" fill="#fde047"/>

    <!-- Polip Karang Matahari 2 -->
    <path d="M150 370 Q 145 330, 175 320 Q 195 310, 205 345 Q 210 375, 180 380 Z" fill="url(#yellowSunCoral)"/>
    <circle cx="170" cy="335" r="6" fill="#fef08a"/>
    <circle cx="188" cy="342" r="5" fill="#fde047"/>
  </g>

  <!-- Red Sea Anemone with Bulbous Tentacles (Anemon Laut Merah) -->
  <g transform="translate(110, 320)" filter="url(#glowRight)">
    <!-- Base -->
    <ellipse cx="25" cy="50" rx="35" ry="12" fill="#7f1d1d"/>
    <!-- Tentacles -->
    <path d="M5 50 Q -10 20, -5 0" stroke="url(#anemoneRed)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="-5" cy="0" r="5" fill="#fca5a5"/>

    <path d="M15 48 Q 5 15, 12 -5" stroke="url(#anemoneRed)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="12" cy="-5" r="5.5" fill="#fca5a5"/>

    <path d="M25 46 Q 25 10, 28 -12" stroke="url(#anemoneRed)" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    <circle cx="28" cy="-12" r="6" fill="#fca5a5"/>

    <path d="M35 48 Q 45 15, 42 -6" stroke="url(#anemoneRed)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="42" cy="-6" r="5.5" fill="#fca5a5"/>

    <path d="M45 50 Q 60 20, 58 2" stroke="url(#anemoneRed)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="58" cy="2" r="5" fill="#fca5a5"/>
  </g>

  <!-- Foreground Seaweed Fronds (Rumput Laut Depan) -->
  <g class="seaweed-sway-front">
    <path d="M430 380 C 400 270, 445 170, 420 80 C 440 150, 410 260, 445 380 Z" fill="#34d399"/>
    <path d="M220 380 C 200 320, 230 250, 210 180 C 225 240, 205 310, 230 380 Z" fill="url(#kelpRight)"/>
  </g>

  <!-- Giant Sea Clam with Pearl (Kerang Mutiara) -->
  <g transform="translate(45, 335)" filter="url(#glowRight)">
    <!-- Shell Bottom -->
    <path d="M0 25 Q 25 45, 50 25 Q 40 10, 25 10 Q 10 10, 0 25 Z" fill="url(#clamShell)"/>
    <!-- Shell Top Open -->
    <path d="M0 25 Q 25 -5, 50 25 Q 40 18, 25 18 Q 10 18, 0 25 Z" fill="#fdba74"/>
    <!-- Pearl -->
    <circle cx="25" cy="18" r="7" fill="#ffffff"/>
    <circle cx="23" cy="16" r="2.5" fill="#e0f2fe"/>
  </g>
</svg>
