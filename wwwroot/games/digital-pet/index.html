<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Aquarium — Digital Pet (DOOH Interactive)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Lilita+One&family=Poppins:wght@600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Modern QR Code Library & SignalR -->
  <script src="/lib/qrcode/easy.qrcode.min.js"></script>
  <script src="/js/signalr.min.js"></script>
</head>
<body>

  <!-- Efek Cahaya Sinar Matahari Bawah Air -->
  <div class="sun-rays-overlay"></div>
  <div class="caustics-layer"></div>

  <!-- Siluet Terumbu Karang Jauh (Distant Reef Silhouette) -->
  <div class="distant-reef-silhouette"></div>

  <!-- Canvas Utama Akuarium Interaktif (Fish & Particle Physics) -->
  <canvas id="aquariumCanvas"></canvas>

  <!-- Dasar Laut Pasir Emas (Golden Sandy Seabed) -->
  <div class="seabed-floor">
    <div class="seabed-ripples"></div>
    <!-- Starfish & Shells on Seabed Center -->
    <div class="center-starfish-decor">⭐</div>
  </div>

  <!-- Formasi Terumbu Karang Kiri (Sponge Tubes, Brain Coral, Fan Coral, Kelp) -->
  <div class="coral-reef-left-container">
    <img src="images/reef-left.svg" alt="Terumbu Karang Kiri" class="coral-img-fluid" />
  </div>

  <!-- Formasi Terumbu Karang Kanan (Staghorn Coral, Sea Anemone, Rocks, Kelp, Clam) -->
  <div class="coral-reef-right-container">
    <img src="images/reef-right.svg" alt="Terumbu Karang Kanan" class="coral-img-fluid" />
  </div>

  <!-- Top Marine Ribbon Banner (Sesuai Desain Dynamic LED Docx) -->
  <header class="marine-ribbon-banner">
    <div class="ribbon-content">
      <span class="ribbon-sparkle">🌊</span>
      <h1 class="ribbon-title" id="headerTitle">AKUARIUM INTERAKTIF</h1>
      <span class="badge-live-count" id="activePetCount">5 Ikan Berenang</span>
    </div>
  </header>

  <!-- Toast Notifikasi Pet Baru Masuk -->
  <div class="pet-spawn-toast" id="spawnToast">
    <span id="spawnToastText">🎉 Seseorang baru saja mencemplungkan pet!</span>
  </div>

  <!-- QR Code HUD Panel (Pojok Kanan Bawah) -->
  <aside class="qr-hud-panel">
    <h3 class="qr-hud-title">CEMPLUNGKAN PET-MU!</h3>
    <div class="qr-box-inner" id="qrContainer">
      <!-- QR dirender otomatis oleh qrcode.js -->
    </div>
    <p class="qr-hud-instruction">
      Pindai QR lewat HP untuk menggambar atau memilih hewan lautmu!
    </p>
  </aside>
  <script src="script.js"></script>
</body>
</html>
