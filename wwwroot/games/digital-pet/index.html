<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Aquarium — Digital Pet (DOOH Interactive)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Lilita+One&family=Poppins:wght@600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- CDN QR Code JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- Efek Cahaya Sinar Matahari Bawah Air -->
  <div class="sun-rays-overlay"></div>

  <!-- Dasar Laut & Siluet Karang -->
  <div class="seabed-floor"></div>

  <!-- Canvas Utama Akuarium Interaktif -->
  <canvas id="aquariumCanvas"></canvas>

  <!-- Top Banner Capsule HUD -->
  <header class="aquarium-header">
    <span class="aquarium-title" id="headerTitle">VIRTUAL AQUARIUM: DIGITAL PET</span>
    <span class="badge-live-count" id="activePetCount">5 Pet Berenang</span>
  </header>

  <!-- Toast Notifikasi Pet Baru Masuk -->
  <div class="pet-spawn-toast" id="spawnToast">
    <span id="spawnToastText">🎉 Seseorang baru saja mencemplungkan pet!</span>
  </div>

  <!-- QR Code HUD Panel (Pojok Kanan Bawah) -->
  <aside class="qr-hud-panel">
    <h3 class="qr-hud-title">CEMPLUNGKAN PET-MU!</h3>
    <div class="qr-box-inner" id="qrContainer">
      <!-- QR dirender otomatis oleh qrcode.js -->
    </div>
    <p class="qr-hud-instruction">
      Pindai QR lewat HP untuk menggambar atau memilih hewan lautmu!
    </p>
    <div id="qrUrlHint" style="font-size: 10px; color: #7dd3fc; word-break: break-all; opacity: 0.85; max-width: 100%; font-family: monospace;"></div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
